<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="" routerLink="/" [title]="L.t('nav_home')">
      <img src="assets/logo-full.png" class="brand-full" alt="Appraisal Canada — real estate appraisals across Canada">
    </a>

    <nav id="primary-nav" class="nav" [class.open]="menuValue" [attr.aria-label]="L.t('a11y_primary_nav')">
      <a href="" routerLink="/" class="nav-link" (click)="closeMenu()">{{ L.t('nav_home') }}</a>
      <a href="" routerLink="/services" class="nav-link" (click)="closeMenu()">{{ L.t('nav_services') }}</a>
      <a href="" routerLink="/appraisers" class="nav-link" (click)="closeMenu()">{{ L.t('nav_appraisers') }}</a>
      <a href="" routerLink="/resources" class="nav-link" (click)="closeMenu()">{{ L.t('nav_resources') }}</a>
      <a href="" routerLink="/contact" class="nav-link nav-link-cta" (click)="closeMenu()">{{ L.t('nav_contact') }}</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="theme-toggle" (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? L.t('a11y_light_mode') : L.t('a11y_dark_mode')"
        [title]="theme.theme() === 'dark' ? L.t('a11y_light_mode') : L.t('a11y_dark_mode')">
        <i class="fa-solid" aria-hidden="true" [class.fa-moon]="theme.theme() === 'light'" [class.fa-sun]="theme.theme() === 'dark'"></i>
      </button>
      <div class="lang-select-wrap" [title]="L.t('a11y_language')">
        <i class="fa-solid fa-globe" aria-hidden="true"></i>
        <select class="lang-select" [value]="L.lang()" (change)="onLang($event)" [attr.aria-label]="L.t('a11y_language')">
          @for (l of L.languages; track l.code) {
          <option [value]="l.code">{{ l.label }}</option>
          }
        </select>
      </div>
      <button type="button" class="menu-icon" (click)="openMenu()"
        [attr.aria-label]="L.t('a11y_menu')" [attr.aria-expanded]="menuValue" aria-controls="primary-nav">
        <i class="{{menu_icon}}" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
